services:
  - type: web
    name: aurigin-app
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.0.0
      - key: MODE
        value: DEMO
      - key: DATABASE_PATH
        value: data/aurigin.sqlite
